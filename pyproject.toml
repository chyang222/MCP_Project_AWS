[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-aws-mcp"
version = "0.1.1"
description = "MCP server to control AWS resources directly from Claude Desktop or Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "aws", "claude", "ai", "ec2", "s3", "bedrock"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "boto3>=1.34.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
aws-mcp = "aws_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["aws_mcp"]

[project.urls]
Homepage = "https://github.com/chyang222/MCP_Project_AWS"
Repository = "https://github.com/chyang222/MCP_Project_AWS"
